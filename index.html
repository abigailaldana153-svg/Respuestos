<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Stock - AutoPartes</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b; /* Color naranja cálido */
      --accent-hover: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --badge-bg: #334155;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.2rem;
      color: var(--accent);
      font-weight: 800;
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-box {
      margin-bottom: 16px;
      display: flex;
      gap: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text);
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-code {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 700;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .tag {
      background-color: var(--badge-bg);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .tag-eq {
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .price {
      font-weight: 700;
      color: var(--success);
      font-size: 1.1rem;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      display: flex;
      border-top: 1px solid var(--border);
    }

    .nav-item {
      flex: 1;
      padding: 12px;
      text-align: center;
      color: var(--text-muted);
      background: none;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: 700;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    #scanner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      border: 2px solid var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Repuestos & Stock</h1>
  </header>

  <div class="container">
    
    <!-- Pestaña Buscar / Lista -->
    <div id="tab-search" class="tab-content active">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar por repuesto, código, equivalencia o auto..." oninput="filterProducts()">
        <button class="btn btn-secondary" onclick="openScanner('search')">📷</button>
      </div>

      <div id="product-list"></div>
    </div>

    <!-- Pestaña Agregar Repuesto -->
    <div id="tab-add" class="tab-content">
      <form id="add-form" onsubmit="saveProduct(event)">
        <div class="form-group">
          <label for="p-name">Nombre del Repuesto *</label>
          <input type="text" id="p-name" placeholder="Ej: Filtro de Aceite" required>
        </div>

        <div class="form-group">
          <label for="p-code">Código de Pieza (Principal / Barras) *</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="p-code" placeholder="Ej: WO-200 / 7791234567890" required>
            <button type="button" class="btn btn-secondary" onclick="openScanner('add')">📷</button>
          </div>
        </div>

        <div class="form-group">
          <label for="p-eq">Equivalencias / Códigos Cruzados</label>
          <input type="text" id="p-eq" placeholder="Ej: Mann W712, Fram PH5796, Tecneco OL200">
        </div>

        <div class="form-group">
          <label for="p-apps">Aplicaciones / Vehículos Compatibles</label>
          <textarea id="p-apps" rows="2" placeholder="Ej: Fiat Palio, Siena, Uno Fire 1.3 16V"></textarea>
        </div>

        <div class="form-group">
          <label for="p-brand">Marca</label>
          <input type="text" id="p-brand" placeholder="Ej: Wega">
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label for="p-stock">Cantidad / Stock</label>
            <input type="number" id="p-stock" value="1" min="0">
          </div>
          <div style="flex: 1;">
            <label for="p-price">Precio ($)</label>
            <input type="number" id="p-price" placeholder="Ej: 8500" step="0.01">
          </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">💾 Guardar Repuesto</button>
      </form>
    </div>

  </div>

  <!-- Modal Escáner -->
  <div id="scanner-modal">
    <p style="color:#fff; margin-bottom: 12px;">Apuntá al código de barras</p>
    <video id="video-preview"></video>
    <button class="btn" style="margin-top: 16px; background: #ef4444; color: #fff;" onclick="closeScanner()">Cerrar Cámara</button>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('search')">🔍 Buscar</button>
    <button class="nav-item" onclick="switchTab('add')">➕ Agregar</button>
  </nav>

  <script>
    let products = JSON.parse(localStorage.getItem('autopartes_stock') || '[]');
    let codeReader = null;
    let currentScanTarget = 'search';

    function saveProduct(e) {
      e.preventDefault();
      
      const newProduct = {
        id: Date.now(),
        name: document.getElementById('p-name').value,
        code: document.getElementById('p-code').value,
        equivalences: document.getElementById('p-eq').value,
        applications: document.getElementById('p-apps').value,
        brand: document.getElementById('p-brand').value || 'Generica',
        stock: parseInt(document.getElementById('p-stock').value) || 0,
        price: parseFloat(document.getElementById('p-price').value) || 0
      };

      products.push(newProduct);
      localStorage.setItem('autopartes_stock', JSON.stringify(products));
      
      document.getElementById('add-form').reset();
      switchTab('search');
      renderProducts();
    }

    function renderProducts(filter = '') {
      const list = document.getElementById('product-list');
      list.innerHTML = '';

      const term = filter.toLowerCase().trim();

      const filtered = products.filter(p => 
        p.name.toLowerCase().includes(term) ||
        p.code.toLowerCase().includes(term) ||
        (p.equivalences && p.equivalences.toLowerCase().includes(term)) ||
        (p.applications && p.applications.toLowerCase().includes(term)) ||
        p.brand.toLowerCase().includes(term)
      );

      if (filtered.length === 0) {
        list.innerHTML = '<p style="text-align:center; color: var(--text-muted); margin-top: 20px;">No se encontraron repuestos.</p>';
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="card-title">${p.name}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">${p.brand}</div>
            </div>
            <div class="card-code">${p.code}</div>
          </div>
          
          ${p.equivalences ? `
            <div class="tag-container">
              <span class="tag tag-eq">🔄 Eq: ${p.equivalences}</span>
            </div>
          ` : ''}

          ${p.applications ? `
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;">
              🚗 <strong>Aplicación:</strong> ${p.applications}
            </div>
          ` : ''}

          <div class="card-footer">
            <div>Stock: <strong>${p.stock} u.</strong></div>
            <div class="price">$${p.price.toLocaleString()}</div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function filterProducts() {
      const term = document.getElementById('search-input').value;
      renderProducts(term);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tab === 'search') {
        document.getElementById('tab-search').classList.add('active');
        event.target.classList.add('active');
      } else {
        document.getElementById('tab-add').classList.add('active');
        event.target.classList.add('active');
      }
    }

    function openScanner(target) {
      currentScanTarget = target;
      document.getElementById('scanner-modal').style.display = 'flex';
      codeReader = new ZXing.BrowserMultiFormatReader();
      
      codeReader.decodeFromVideoDevice(null, 'video-preview', (result, err) => {
        if (result) {
          const code = result.text;
          closeScanner();

          if (currentScanTarget === 'search') {
            document.getElementById('search-input').value = code;
            filterProducts();
          } else {
            document.getElementById('p-code').value = code;
          }
        }
      });
    }

    function closeScanner() {
      if (codeReader) {
        codeReader.reset();
      }
      document.getElementById('scanner-modal').style.display = 'none';
    }

    renderProducts();
  </script>
</body>
</html>
