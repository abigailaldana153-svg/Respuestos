<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepuestosPro - Filtro por Marcas</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card-bg: rgba(23, 31, 51, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 23, 42, 0.6);
      
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --accent-glow: rgba(59, 130, 246, 0.35);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b0f19;
      background-image: var(--bg-gradient);
      color: var(--text-main);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    /* Pantalla Login */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-gradient);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 30px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      padding: 14px 20px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      padding: 20px 16px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Buscador */
    .search-wrapper {
      position: relative;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }

    .search-input-group {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    /* FILTROS E ÍNDICE */
    .filter-section {
      margin-bottom: 16px;
    }

    .filter-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-btn.active-brand {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .chip-btn.active-cat {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* ENCABEZADOS DE GRUPO */
    .brand-group-header {
      font-size: 1.1rem;
      font-weight: 800;
      color: #34d399;
      margin: 20px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-group-subheader {
      font-size: 0.9rem;
      font-weight: 700;
      color: #60a5fa;
      margin: 12px 0 8px 8px;
    }

    .btn-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      font-weight: 700;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      width: 100%;
      text-align: center;
      font-weight: 600;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    /* TARJETA DE PRODUCTO */
    .product-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
    }

    .product-img-wrapper {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 10px;
      background: #0f172a;
      cursor: pointer;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .code-chip {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .compat-banner {
      background: rgba(15, 23, 42, 0.8);
      border-left: 3px solid #3b82f6;
      padding: 8px 10px;
      margin: 8px 0;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .price-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #34d399;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      cursor: pointer;
    }

    .nav-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px;
      display: flex;
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 24px;
      cursor: pointer;
    }

    .nav-item.active {
      background: var(--accent-gradient);
      color: #ffffff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .photo-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Modal Login / Recuperación -->
  <div id="login-screen">
    <div class="login-card">
      <div style="font-size: 2.5rem; margin-bottom: 8px;">⚙️</div>
      <h2 style="margin-bottom: 12px;">RepuestosPro</h2>
      
      <!-- Formulario de Login -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group"><input type="email" id="login-email" placeholder="Correo" required></div>
        <div class="form-group"><input type="password" id="login-pass" placeholder="Contraseña" required></div>
        <button type="submit" class="btn-primary" style="width: 100%;">Ingresar</button>
        <p style="margin-top: 14px;">
          <a href="#" onclick="showResetPassword(event)" style="color: #60a5fa; font-size: 0.85rem; text-decoration: none;">¿Olvidaste tu contraseña?</a>
        </p>
      </form>

      <!-- Formulario para Recuperar Contraseña -->
      <form id="reset-form" style="display: none;" onsubmit="handleResetPassword(event)">
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Ingresá tu correo y definí una nueva contraseña:</p>
        <div class="form-group"><input type="email" id="reset-email" placeholder="Correo registrado" required></div>
        <div class="form-group"><input type="password" id="reset-new-pass" placeholder="Nueva Contraseña" required></div>
        <button type="submit" class="btn-primary" style="width: 100%;">Guardar Nueva Contraseña</button>
        <button type="button" class="btn-outline" style="margin-top: 8px;" onclick="hideResetPassword(event)">Volver al Login</button>
      </form>
    </div>
  </div>

  <header>
    <div class="brand-logo">⚙️ RepuestosPro</div>
    <div id="user-display" style="font-size: 0.8rem; color: var(--text-muted);">👤 Usuario</div>
  </header>

  <div class="container">
    
    <!-- TAB BUSCAR -->
    <div id="tab-search" class="tab-content active">
      
      <div class="search-wrapper">
        <div class="search-input-group">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Buscar buje, código, modelo..." oninput="renderProducts()">
        </div>
      </div>

      <!-- ÍNDICE DE MARCAS DE AUTO -->
      <div class="filter-section">
        <div class="filter-title">🚗 Seleccionar Marca de Auto:</div>
        <div class="chips-row" id="brand-chips"></div>
      </div>

      <!-- ÍNDICE DE CATEGORÍAS -->
      <div class="filter-section">
        <div class="filter-title">📂 Categoría / Tipo:</div>
        <div class="chips-row" id="category-chips"></div>
      </div>

      <!-- LISTADO DE PRODUCTOS -->
      <div id="product-list"></div>

    </div>

    <!-- TAB CARGAR -->
    <div id="tab-add" class="tab-content">
      <div class="form-card">
        <h3 id="form-header-title" style="margin-bottom: 16px;">⚡ Cargar Nuevo Repuesto</h3>
        
        <form id="add-form" onsubmit="saveProduct(event)">
          <input type="hidden" id="p-editing-id" value="">

          <div class="form-group">
            <label>Nombre del Repuesto *</label>
            <input type="text" id="p-name" placeholder="Ej: Buje Parrilla / Soporte Motor" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Marca del Auto *</label>
              <select id="p-auto-brand">
                <option value="Ford">Ford</option>
                <option value="Fiat">Fiat</option>
                <option value="Chevrolet">Chevrolet</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Renault">Renault</option>
                <option value="Peugeot">Peugeot</option>
                <option value="Citroën">Citroën</option>
                <option value="Toyota">Toyota</option>
                <option value="Universal / Multimarca">Universal / Multimarca</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Categoría *</label>
              <select id="p-cat">
                <option value="Bujes / Tacos / Gomitas">Bujes / Tacos / Gomitas</option>
                <option value="Soportes de Motor">Soportes de Motor</option>
                <option value="Focadura / Iluminación">Focadura / Iluminación</option>
                <option value="Aceites / Lubricantes">Aceites / Lubricantes</option>
                <option value="Filtros">Filtros</option>
                <option value="Frenos">Frenos</option>
                <option value="Otros">Otros</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Marca del Repuesto (Fabricante)</label>
            <input type="text" id="p-brand" placeholder="Ej: Sampel / Osram">
          </div>

          <div class="form-group">
            <label>Modelos Compatibles</label>
            <input type="text" id="p-apps" placeholder="Ej: Escort, Focus, F100">
          </div>

          <div class="form-group">
            <label>Equivalencias / Código Cruzado</label>
            <input type="text" id="p-eq" placeholder="Ej: Mann W712">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Código de Pieza</label>
              <input type="text" id="p-code" placeholder="Ej: BU-104">
            </div>
            <div class="form-group">
              <label>Ubicación</label>
              <input type="text" id="p-location" placeholder="Estante A2">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Precio ($) *</label>
              <input type="number" id="p-price" placeholder="7000" required>
            </div>
            <div class="form-group">
              <label>Stock *</label>
              <input type="number" id="p-stock" value="10" required>
            </div>
          </div>

          <div class="form-group">
            <label>Foto</label>
            <input type="file" accept="image/*" onchange="handlePhotoUpload(event)">
            <img id="photo-preview" class="photo-preview" alt="Vista Previa">
          </div>

          <button type="submit" id="btn-submit-form" class="btn-primary" style="width: 100%; margin-top: 10px;">💾 Guardar Repuesto</button>
          <button type="button" id="btn-cancel-edit" class="btn-outline" style="margin-top: 8px; display: none;" onclick="resetForm()">Cancelar</button>
        </form>
      </div>
    </div>

  </div>

  <nav class="nav-bar">
    <button class="nav-item active" id="btn-tab-search" onclick="switchTab('search')">🔍 Buscar</button>
    <button class="nav-item" id="btn-tab-add" onclick="switchTab('add')">➕ Cargar</button>
  </nav>

  <script>
    let products = JSON.parse(localStorage.getItem('autopartes_stock') || '[]');
    let currentPhotoBase64 = '';
    let selectedBrandFilter = 'TODAS';
    let selectedCategoryFilter = 'TODAS';

    const BRANDS_LIST = ["TODAS", "Ford", "Fiat", "Chevrolet", "Volkswagen", "Renault", "Peugeot", "Citroën", "Toyota", "Universal / Multimarca"];
    const CATEGORIES_LIST = ["TODAS", "Bujes / Tacos / Gomitas", "Soportes de Motor", "Focadura / Iluminación", "Aceites / Lubricantes", "Filtros", "Frenos", "Otros"];

    function checkAuth() {
      const activeUser = localStorage.getItem('autopartes_session');
      if (activeUser) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('user-display').innerText = `👤 ${activeUser}`;
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;

      // Verifica si existe contraseña guardada; si es la primera vez para ese correo, la establece automáticamente
      const savedPass = localStorage.getItem('user_pass_' + email);
      
      if (savedPass && savedPass !== pass) {
        alert('Contraseña incorrecta. Si la olvidaste, usá el enlace de abajo para recuperarla.');
        return;
      }

      if (!savedPass) {
        localStorage.setItem('user_pass_' + email, pass);
      }

      localStorage.setItem('autopartes_session', email);
      checkAuth();
    }

    function showResetPassword(e) {
      e.preventDefault();
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('reset-form').style.display = 'block';
    }

    function hideResetPassword(e) {
      e.preventDefault();
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
    }

    function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      const newPass = document.getElementById('reset-new-pass').value;

      if (!email || !newPass) return;

      localStorage.setItem('user_pass_' + email, newPass);
      alert('¡Contraseña actualizada con éxito! Ya podés iniciar sesión con tu nueva clave.');
      
      document.getElementById('reset-email').value = '';
      document.getElementById('reset-new-pass').value = '';
      hideResetPassword(e);
    }

    function renderFilterChips() {
      const bContainer = document.getElementById('brand-chips');
      bContainer.innerHTML = '';
      BRANDS_LIST.forEach(b => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `chip-btn ${selectedBrandFilter === b ? 'active-brand' : ''}`;
        btn.innerText = `🚗 ${b}`;
        btn.onclick = () => {
          selectedBrandFilter = b;
          renderFilterChips();
          renderProducts();
        };
        bContainer.appendChild(btn);
      });

      const cContainer = document.getElementById('category-chips');
      cContainer.innerHTML = '';
      CATEGORIES_LIST.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `chip-btn ${selectedCategoryFilter === cat ? 'active-cat' : ''}`;
        btn.innerText = `📂 ${cat}`;
        btn.onclick = () => {
          selectedCategoryFilter = cat;
          renderFilterChips();
          renderProducts();
        };
        cContainer.appendChild(btn);
      });
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentPhotoBase64 = e.target.result;
          const imgPreview = document.getElementById('photo-preview');
          imgPreview.src = currentPhotoBase64;
          imgPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProduct(e) {
      e.preventDefault();
      const editingId = document.getElementById('p-editing-id').value;

      const newProd = {
        id: editingId ? Number(editingId) : Date.now(),
        name: document.getElementById('p-name').value,
        autoBrand: document.getElementById('p-auto-brand').value,
        brand: document.getElementById('p-brand').value || 'Genérico',
        category: document.getElementById('p-cat').value,
        applications: document.getElementById('p-apps').value || 'Varias',
        equivalences: document.getElementById('p-eq').value || '',
        code: document.getElementById('p-code').value || 'S/C',
        location: document.getElementById('p-location').value || 'Sin ubicación',
        price: parseFloat(document.getElementById('p-price').value) || 0,
        stock: parseInt(document.getElementById('p-stock').value) || 0,
        photo: currentPhotoBase64
      };

      if (editingId) {
        const idx = products.findIndex(p => p.id == editingId);
        if (idx !== -1) products[idx] = newProd;
      } else {
        products.unshift(newProd);
      }

      localStorage.setItem('autopartes_stock', JSON.stringify(products));
      resetForm();
      switchTab('search');
      renderProducts();
    }

    function renderProducts() {
      const list = document.getElementById('product-list');
      list.innerHTML = '';

      const term = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = products.filter(p => {
        const autoB = p.autoBrand || 'Universal / Multimarca';
        const matchBrand = (selectedBrandFilter === 'TODAS') || (autoB === selectedBrandFilter);
        const matchCat = (selectedCategoryFilter === 'TODAS') || (p.category === selectedCategoryFilter);
        const matchSearch = p.name.toLowerCase().includes(term) ||
          p.code.toLowerCase().includes(term) ||
          (p.applications && p.applications.toLowerCase().includes(term));

        return matchBrand && matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<p style="text-align:center; padding:30px; color:var(--text-muted);">No hay repuestos registrados bajo esta marca o filtro.</p>`;
        return;
      }

      // Agrupar por Marca
      const grouped = {};
      filtered.forEach(p => {
        const b = p.autoBrand || 'Universal / Multimarca';
        if (!grouped[b]) grouped[b] = [];
        grouped[b].push(p);
      });

      for (const [brandName, items] of Object.entries(grouped)) {
        const header = document.createElement('div');
        header.className = 'brand-group-header';
        header.innerHTML = `🚗 MARCA: ${brandName.toUpperCase()}`;
        list.appendChild(header);

        items.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            ${p.photo ? `<div class="product-img-wrapper"><img src="${p.photo}" class="product-img"></div>` : ''}
            <div class="card-top">
              <div>
                <div class="product-title">${p.name}</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">${p.brand} • ${p.category}</div>
              </div>
              <div class="code-chip">${p.code}</div>
            </div>
            <div class="compat-banner">🚗 Para: <strong>${p.applications}</strong></div>
            <div class="card-bottom">
              <div>Stock: <strong>${p.stock} u.</strong> | 📍 ${p.location}</div>
              <div class="price-value">$${p.price.toLocaleString('es-AR')}</div>
            </div>
            <div class="card-actions">
              <button class="btn-action" onclick="editProduct(${p.id})">✏️ Editar</button>
              <button class="btn-action" onclick="deleteProduct(${p.id})" style="color:#fca5a5;">🗑️ Borrar</button>
            </div>
          `;
          list.appendChild(card);
        });
      }
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id == id);
      if (!p) return;

      document.getElementById('p-editing-id').value = p.id;
      document.getElementById('p-name').value = p.name;
      document.getElementById('p-auto-brand').value = p.autoBrand || 'Ford';
      document.getElementById('p-cat').value = p.category;
      document.getElementById('p-brand').value = p.brand;
      document.getElementById('p-apps').value = p.applications;
      document.getElementById('p-eq').value = p.equivalences || '';
      document.getElementById('p-code').value = p.code;
      document.getElementById('p-location').value = p.location;
      document.getElementById('p-price').value = p.price;
      document.getElementById('p-stock').value = p.stock;

      currentPhotoBase64 = p.photo || '';
      if (currentPhotoBase64) {
        document.getElementById('photo-preview').src = currentPhotoBase64;
        document.getElementById('photo-preview').style.display = 'block';
      }

      document.getElementById('form-header-title').innerText = '✏️ Editar Repuesto';
      document.getElementById('btn-submit-form').innerText = '💾 Actualizar';
      document.getElementById('btn-cancel-edit').style.display = 'block';

      switchTab('add');
    }

    function deleteProduct(id) {
      if (confirm('¿Borrar repuesto?')) {
        products = products.filter(p => p.id != id);
        localStorage.setItem('autopartes_stock', JSON.stringify(products));
        renderProducts();
      }
    }

    function resetForm() {
      document.getElementById('add-form').reset();
      document.getElementById('p-editing-id').value = '';
      currentPhotoBase64 = '';
      document.getElementById('photo-preview').style.display = 'none';
      document.getElementById('form-header-title').innerText = '⚡ Cargar Nuevo Repuesto';
      document.getElementById('btn-submit-form').innerText = '💾 Guardar Repuesto';
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tab === 'search') {
        document.getElementById('tab-search').classList.add('active');
        document.getElementById('btn-tab-search').classList.add('active');
      } else {
        document.getElementById('tab-add').classList.add('active');
        document.getElementById('btn-tab-add').classList.add('active');
      }
    }

    // Inicializar al cargar
    window.onload = function() {
      checkAuth();
      renderFilterChips();
      renderProducts();
    };
  </script>
</body>
</html>
