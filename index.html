<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepuestosPro - Sistema Profesional</title>
  <!-- Librería Zxing para códigos de barras -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1322 100%);
      --card-bg: rgba(23, 31, 51, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 23, 42, 0.7);
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --accent-glow: rgba(59, 130, 246, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0b0f19;
      background-image: var(--bg-gradient);
      color: var(--text-main);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    /* Pantalla Login */
    #login-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-gradient);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 30px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      padding: 14px 20px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ESTILO DE LA FOTO: CAJA SUPERIOR "ÍNDICE DE MARCAS" */
    .top-brands-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brands-horizontal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .brand-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-pill:hover {
      background: rgba(59, 130, 246, 0.1);
      color: var(--text-main);
    }

    .brand-pill.active {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Buscador y Botón Cámara */
    .search-wrapper {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .search-input-group {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      backdrop-filter: blur(16px);
    }

    .btn-scan-cam {
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      padding: 0 18px;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* COLUMNAS DE FILTRADO ESTILO CAPTURA */
    .filters-columns-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .filters-columns-container {
        grid-template-columns: 1fr;
      }
    }

    .filter-column-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .column-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .column-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .column-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 10px;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
    }

    .column-item.active {
      background: var(--accent-gradient);
      color: #ffffff;
      border-color: transparent;
      font-weight: 700;
    }

    .brand-group-header {
      font-size: 1rem;
      font-weight: 800;
      color: #34d399;
      margin: 20px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid rgba(16, 185, 129, 0.3);
    }

    /* Botones y Formularios generales */
    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      font-weight: 700;
      padding: 14px 20px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px var(--accent-glow);
      width: 100%;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      width: 100%;
      text-align: center;
      font-weight: 600;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-group { margin-bottom: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    /* TARJETA DE PRODUCTO */
    .product-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
    }

    .product-img-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 10px;
      background: #0f172a;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .product-title { font-size: 1.05rem; font-weight: 800; }
    .code-chip {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .compat-banner {
      background: rgba(15, 23, 42, 0.8);
      border-left: 3px solid #3b82f6;
      padding: 8px 10px;
      margin: 8px 0;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .equiv-banner { font-size: 0.78rem; color: #34d399; margin-top: 4px; }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .price-value { font-size: 1.2rem; font-weight: 800; color: #34d399; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }

    .btn-action {
      flex: 1;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      cursor: pointer;
    }

    .nav-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px;
      display: flex;
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 24px;
      cursor: pointer;
      text-align: center;
    }

    .nav-item.active {
      background: var(--accent-gradient);
      color: #ffffff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Modal Escáner */
    #scanner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Modal Login -->
  <div id="login-screen">
    <div class="login-card">
      <div style="font-size: 2.5rem; margin-bottom: 8px;">⚙️</div>
      <h2 style="margin-bottom: 12px;">RepuestosPro</h2>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group"><input type="email" id="login-email" placeholder="Correo" required></div>
        <div class="form-group"><input type="password" id="login-pass" placeholder="Contraseña" required></div>
        <button type="submit" class="btn-primary">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- Modal Cámara / Escáner -->
  <div id="scanner-modal">
    <h3 style="color:white; margin-bottom: 15px; margin-top: 20px;">📷 Escaneando código de barras...</h3>
    <div style="max-width: 400px; margin: 0 auto; border-radius: 14px; overflow: hidden; border: 2px solid #3b82f6;">
      <video id="interactive-video" style="width: 100%; display: block;"></video>
    </div>
    <button type="button" class="btn-outline" style="max-width: 200px; margin: 20px auto;" onclick="stopScanner()">Cerrar Cámara</button>
  </div>

  <header>
    <div class="brand-logo">⚙️ RepuestosPro</div>
    <div id="user-display" style="font-size: 0.8rem; color: var(--text-muted);">👤 Usuario</div>
  </header>

  <div class="container">
    
    <!-- TAB BUSCAR / INICIO -->
    <div id="tab-search" class="tab-content active">
      
      <!-- 1. ÍNDICE DE MARCAS SUPERIOR (ESTILO CAPTURA) -->
      <div class="top-brands-card">
        <div class="section-title">🚗 Índice de Marcas</div>
        <div class="brands-horizontal-grid" id="top-brands-container"></div>
      </div>

      <!-- 2. BARRA DE BÚSQUEDA Y CÁMARA INTELIGENTE -->
      <div class="search-wrapper">
        <div class="search-input-group">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Buscar por nombre, código..." oninput="renderProducts()">
        </div>
        <button class="btn-scan-cam" onclick="startSmartScanner()" title="Escanear Código de Barras">📷</button>
      </div>

      <!-- 3. COLUMNAS DE FILTRADO EXTRA (ÍNDICE / MARCA / CATEGORÍA) -->
      <div class="filters-columns-container">
        <!-- Columna Índice numérico rápido -->
        <div class="filter-column-card">
          <div class="column-header">Índice rápido</div>
          <div class="column-list" id="col-index-list">
            <div class="column-item active" onclick="setIndexFilter('TODOS', this)">Todos los registros</div>
            <div class="column-item" onclick="setIndexFilter('1', this)">1. Destacados</div>
            <div class="column-item" onclick="setIndexFilter('2', this)">2. Stock Alto</div>
            <div class="column-item" onclick="setIndexFilter('3', this)">3. Nuevos</div>
          </div>
        </div>

        <!-- Columna Marca de Auto -->
        <div class="filter-column-card">
          <div class="column-header">Marca de auto</div>
          <div class="column-list" id="col-brand-list"></div>
        </div>

        <!-- Columna Categoría -->
        <div class="filter-column-card">
          <div class="column-header">Categoría</div>
          <div class="column-list" id="col-cat-list"></div>
        </div>
      </div>

      <!-- LISTA DE PRODUCTOS RESULTANTES -->
      <div id="product-list"></div>
    </div>

    <!-- TAB CARGAR -->
    <div id="tab-add" class="tab-content">
      <div class="form-card">
        <h3 id="form-header-title" style="margin-bottom: 16px;">⚡ Cargar o Editar Repuesto</h3>
        
        <form id="add-form" onsubmit="saveProduct(event)">
          <input type="hidden" id="p-editing-id" value="">

          <div class="form-group">
            <label>Nombre del Repuesto *</label>
            <input type="text" id="p-name" placeholder="Ej: Filtro de Aceite" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Marca de Auto *</label>
              <select id="p-auto-brand">
                <option value="Ford">Ford</option>
                <option value="Fiat">Fiat</option>
                <option value="Chevrolet">Chevrolet</option>
                <option value="Volkswagen">Volkswagen</option>
                <option value="Renault">Renault</option>
                <option value="Peugeot">Peugeot</option>
                <option value="Citroën">Citroën</option>
                <option value="Toyota">Toyota</option>
                <option value="Universal / Multimarca">Universal / Multimarca</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Categoría *</label>
              <select id="p-cat">
                <option value="Filtros">Filtros</option>
                <option value="Bujes / Tacos / Gomitas">Bujes / Tacos / Gomitas</option>
                <option value="Soportes de Motor">Soportes de Motor</option>
                <option value="Iluminación">Iluminación</option>
                <option value="Lubricantes">Lubricantes</option>
                <option value="Frenos">Frenos</option>
                <option value="Otros">Otros</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Código de Pieza (Principal / Barras)</label>
              <div style="display:flex; gap:6px;">
                <input type="text" id="p-code" placeholder="Ej: W712">
                <button type="button" class="btn-scan-cam" style="padding: 0 10px; font-size:1rem;" onclick="startFormScanner()">📷</button>
              </div>
            </div>
            <div class="form-group">
              <label>Marca Fabricante</label>
              <input type="text" id="p-brand" placeholder="Ej: Mann / Fram">
            </div>
          </div>

          <div class="form-group">
            <label>Equivalencias / Códigos Cruzados</label>
            <input type="text" id="p-eq" placeholder="Ej: PH2870, Tecneco OL712">
          </div>

          <div class="form-group">
            <label>Modelos Compatibles</label>
            <input type="text" id="p-apps" placeholder="Ej: Gol Trend, Voyage, Fox">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Precio ($) *</label>
              <input type="number" id="p-price" placeholder="7000" required>
            </div>
            <div class="form-group">
              <label>Stock *</label>
              <input type="number" id="p-stock" value="10" required>
            </div>
          </div>

          <div class="form-group">
            <label>Ubicación</label>
            <input type="text" id="p-location" placeholder="Estante A2">
          </div>

          <div class="form-group">
            <label>Foto del Repuesto</label>
            <input type="file" accept="image/*" id="photo-input" onchange="handlePhotoUpload(event)">
            <img id="photo-preview" style="width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-top:8px; display:none;" alt="Preview">
          </div>

          <button type="submit" id="btn-submit-form" class="btn-primary" style="margin-top: 10px;">💾 Guardar Repuesto</button>
          <button type="button" id="btn-cancel-edit" class="btn-outline" style="margin-top: 8px; display: none;" onclick="resetForm()">Cancelar</button>
        </form>
      </div>
    </div>

  </div>

  <nav class="nav-bar">
    <button class="nav-item active" id="btn-tab-search" onclick="switchTab('search')">🔍 Buscar</button>
    <button class="nav-item" id="btn-tab-add" onclick="switchTab('add')">➕ Cargar</button>
  </nav>

  <script>
    let products = JSON.parse(localStorage.getItem('autopartes_stock') || '[]');
    let currentPhotoBase64 = '';
    let selectedBrandFilter = 'TODAS';
    let selectedCategoryFilter = 'TODAS';
    let codeReader = new ZXing.BrowserBarcodeReader();

    const BRANDS_LIST = ["TODAS", "Ford", "Fiat", "Chevrolet", "Volkswagen", "Renault", "Peugeot", "Citroën", "Toyota", "Universal / Multimarca"];
    const CATEGORIES_LIST = ["TODAS", "Filtros", "Bujes / Tacos / Gomitas", "Soportes de Motor", "Iluminación", "Lubricantes", "Frenos", "Otros"];

    function checkAuth() {
      const activeUser = localStorage.getItem('autopartes_session');
      if (activeUser) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('user-display').innerText = `👤 ${activeUser}`;
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      localStorage.setItem('autopartes_session', email);
      checkAuth();
    }

    /* RENDERIZAR INTERFAZ DE FILTROS SUPERIOR Y COLUMNAS */
    function renderFiltersUI() {
      // 1. Marcas superiores horizontales
      const topBrandsContainer = document.getElementById('top-brands-container');
      topBrandsContainer.innerHTML = '';
      BRANDS_LIST.forEach(b => {
        const pill = document.createElement('div');
        pill.className = `brand-pill ${selectedBrandFilter === b ? 'active' : ''}`;
        pill.innerText = b === 'TODAS' ? '⚡ Todas' : b;
        pill.onclick = () => {
          selectedBrandFilter = b;
          renderFiltersUI();
          renderProducts();
        };
        topBrandsContainer.appendChild(pill);
      });

      // 2. Columna de Marcas de Auto
      const colBrandList = document.getElementById('col-brand-list');
      colBrandList.innerHTML = '';
      BRANDS_LIST.forEach(b => {
        const item = document.createElement('div');
        item.className = `column-item ${selectedBrandFilter === b ? 'active' : ''}`;
        item.innerText = b;
        item.onclick = () => {
          selectedBrandFilter = b;
          renderFiltersUI();
          renderProducts();
        };
        colBrandList.appendChild(item);
      });

      // 3. Columna de Categorías
      const colCatList = document.getElementById('col-cat-list');
      colCatList.innerHTML = '';
      CATEGORIES_LIST.forEach(c => {
        const item = document.createElement('div');
        item.className = `column-item ${selectedCategoryFilter === c ? 'active' : ''}`;
        item.innerText = c;
        item.onclick = () => {
          selectedCategoryFilter = c;
          renderFiltersUI();
          renderProducts();
        };
        colCatList.appendChild(item);
      });
    }

    function setIndexFilter(val, el) {
      document.querySelectorAll('#col-index-list .column-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      renderProducts();
    }

    /* MANEJO DE IMAGEN BASE64 */
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentPhotoBase64 = e.target.result;
          const img = document.getElementById('photo-preview');
          img.src = currentPhotoBase64;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    /* ESCÁNER INTELIGENTE DE CÓDIGO DE BARRAS */
    function startSmartScanner() {
      document.getElementById('scanner-modal').style.display = 'block';
      codeReader.decodeFromVideoDevice(null, 'interactive-video', (result, err) => {
        if (result) {
          const scannedCode = result.text.trim();
          stopScanner();

          const existing = products.find(p => 
            p.code.toLowerCase() === scannedCode.toLowerCase() || 
            (p.equivalences && p.equivalences.toLowerCase().includes(scannedCode.toLowerCase()))
          );

          if (existing) {
            alert(`¡Encontrado! Abriendo "${existing.name}"...`);
            editProduct(existing.id);
          } else {
            document.getElementById('p-code').value = scannedCode;
            switchTab('add');
            alert(`Código "${scannedCode}" nuevo. Completá los datos para guardarlo.`);
          }
        }
      }).catch(err => {
        console.error("Error cámara:", err);
        alert("No se pudo iniciar la cámara.");
        stopScanner();
      });
    }

    function startFormScanner() {
      document.getElementById('scanner-modal').style.display = 'block';
      codeReader.decodeFromVideoDevice(null, 'interactive-video', (result, err) => {
        if (result) {
          document.getElementById('p-code').value = result.text.trim();
          stopScanner();
        }
      }).catch(err => {
        console.error("Error cámara:", err);
        stopScanner();
      });
    }

    function stopScanner() {
      codeReader.reset();
      document.getElementById('scanner-modal').style.display = 'none';
    }

    /* GUARDAR PRODUCTO */
    function saveProduct(e) {
      e.preventDefault();
      const editingId = document.getElementById('p-editing-id').value;

      const newProd = {
        id: editingId ? Number(editingId) : Date.now(),
        name: document.getElementById('p-name').value,
        autoBrand: document.getElementById('p-auto-brand').value,
        category: document.getElementById('p-cat').value,
        code: document.getElementById('p-code').value || 'S/C',
        brand: document.getElementById('p-brand').value || 'Genérico',
        equivalences: document.getElementById('p-eq').value || '',
        applications: document.getElementById('p-apps').value || 'Varias',
        price: parseFloat(document.getElementById('p-price').value) || 0,
        stock: parseInt(document.getElementById('p-stock').value) || 0,
        location: document.getElementById('p-location').value || 'Sin ubicación',
        photo: currentPhotoBase64
      };

      if (editingId) {
        const idx = products.findIndex(p => p.id == editingId);
        if (idx !== -1) products[idx] = newProd;
      } else {
        products.unshift(newProd);
      }

      localStorage.setItem('autopartes_stock', JSON.stringify(products));
      resetForm();
      switchTab('search');
      renderProducts();
    }

    /* RENDERIZAR LISTA DE PRODUCTOS */
    function renderProducts() {
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      const term = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = products.filter(p => {
        const autoB = p.autoBrand || 'Universal / Multimarca';
        const matchBrand = (selectedBrandFilter === 'TODAS') || (autoB === selectedBrandFilter);
        const matchCat = (selectedCategoryFilter === 'TODAS') || (p.category === selectedCategoryFilter);
        
        const matchSearch = p.name.toLowerCase().includes(term) ||
          p.code.toLowerCase().includes(term) ||
          (p.equivalences && p.equivalences.toLowerCase().includes(term)) ||
          (p.applications && p.applications.toLowerCase().includes(term));

        return matchBrand && matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<p style="text-align:center; padding:30px; color:var(--text-muted);">No se encontraron repuestos con estos filtros.</p>`;
        return;
      }

      const grouped = {};
      filtered.forEach(p => {
        const b = p.autoBrand || 'Universal / Multimarca';
        if (!grouped[b]) grouped[b] = [];
        grouped[b].push(p);
      });

      for (const [brandName, items] of Object.entries(grouped)) {
        const header = document.createElement('div');
        header.className = 'brand-group-header';
        header.innerHTML = `🚗 ${brandName.toUpperCase()}`;
        list.appendChild(header);

        items.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            ${p.photo ? `<div class="product-img-wrapper"><img src="${p.photo}" class="product-img"></div>` : ''}
            <div class="card-top">
              <div>
                <div class="product-title">${p.name}</div>
                <div style="font-size:0.8rem; color:var(--text-muted);">${p.brand} • ${p.category}</div>
                ${p.equivalences ? `<div class="equiv-banner">🔄 Equivalencias: ${p.equivalences}</div>` : ''}
              </div>
              <div class="code-chip">${p.code}</div>
            </div>
            <div class="compat-banner">🚗 Aplicación: <strong>${p.applications}</strong></div>
            <div class="card-bottom">
              <div>Stock: <strong>${p.stock} u.</strong> | 📍 ${p.location}</div>
              <div class="price-value">$${p.price.toLocaleString('es-AR')}</div>
            </div>
            <div class="card-actions">
              <button class="btn-action" onclick="editProduct(${p.id})">✏️ Editar</button>
              <button class="btn-action" onclick="deleteProduct(${p.id})" style="color:#fca5a5;">🗑️ Borrar</button>
            </div>
          `;
          list.appendChild(card);
        });
      }
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id == id);
      if (!p) return;

      document.getElementById('p-editing-id').value = p.id;
      document.getElementById('p-name').value = p.name;
      document.getElementById('p-auto-brand').value = p.autoBrand || 'Ford';
      document.getElementById('p-cat').value = p.category;
      document.getElementById('p-code').value = p.code;
      document.getElementById('p-brand').value = p.brand;
      document.getElementById('p-eq').value = p.equivalences || '';
      document.getElementById('p-apps').value = p.applications;
      document.getElementById('p-price').value = p.price;
      document.getElementById('p-stock').value = p.stock;
      document.getElementById('p-location').value = p.location;

      currentPhotoBase64 = p.photo || '';
      const img = document.getElementById('photo-preview');
      if (currentPhotoBase64) {
        img.src = currentPhotoBase64;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }

      document.getElementById('form-header-title').innerText = '✏️ Editar Repuesto';
      document.getElementById('btn-submit-form').innerText = '💾 Actualizar';
      document.getElementById('btn-cancel-edit').style.display = 'block';

      switchTab('add');
    }

    function deleteProduct(id) {
      if (confirm('¿Eliminar este repuesto?')) {
        products = products.filter(p => p.id != id);
        localStorage.setItem('autopartes_stock', JSON.stringify(products));
        renderProducts();
      }
    }

    function resetForm() {
      document.getElementById('add-form').reset();
      document.getElementById('p-editing-id').value = '';
      currentPhotoBase64 = '';
      document.getElementById('photo-preview').style.display = 'none';
      document.getElementById('form-header-title').innerText = '⚡ Cargar o Editar Repuesto';
      document.getElementById('btn-submit-form').innerText = '💾 Guardar Repuesto';
      document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tab === 'search') {
        document.getElementById('tab-search').classList.add('active');
        document.getElementById('btn-tab-search').classList.add('active');
      } else {
        document.getElementById('tab-add').classList.add('active');
        document.getElementById('btn-tab-add').classList.add('active');
      }
    }

    window.onload = function() {
      checkAuth();
      renderFiltersUI();
      renderProducts();
    };
  </script>
</body>
</html>
